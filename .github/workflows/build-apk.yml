name: APK Derle

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Derle (tam sürüm APK + Play sürümü AAB ve APK)
        run: gradle assembleFullRelease bundlePlayRelease assemblePlayRelease --no-daemon --stacktrace

      - name: Tam sürüm APK (GitHub'dan dağıtım, reklam kalkanlı)
        uses: actions/upload-artifact@v4
        with:
          name: CocukKalkani-tam-apk
          path: app/build/outputs/apk/full/release/*.apk

      - name: Play sürümü AAB (Play Console'a yüklenecek dosya)
        uses: actions/upload-artifact@v4
        with:
          name: CocukKalkani-play-aab
          path: app/build/outputs/bundle/playRelease/*.aab

      - name: Play sürümü APK (telefonda denemek için)
        uses: actions/upload-artifact@v4
        with:
          name: CocukKalkani-play-apk
          path: app/build/outputs/apk/play/release/*.apk
